name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Byte-compile every module
        run: python -m compileall -q tonearm tests

      - name: Import smoke test (no Chrome needed at import time)
        run: |
          python - <<'EOF'
          from tonearm.main import app

          # newer FastAPI nests includes as _IncludedRouter objects; flatten
          def flatten(routes, prefix=""):
              paths = set()
              for r in routes:
                  if type(r).__name__ == "_IncludedRouter":
                      p = getattr(r.include_context, "prefix", "") or ""
                      paths |= flatten(r.original_router.routes, prefix + p)
                  elif getattr(r, "methods", None):
                      paths.add(prefix + r.path)
              return paths

          paths = flatten(app.routes)
          assert len(paths) > 40, f"expected 40+ routes, got {len(paths)}"
          for must in ("/api/library/export", "/api/library/diff",
                       "/api/history/recently-played",
                       "/api/catalog/songs/{song_id}/lyrics",
                       "/api/audio/stream.mp3", "/api/stream", "/demo",
                       "/api/write/sweeps/dedupe", "/api/playback/now-playing",
                       "/api/favorites", "/metrics", "/api/debug"):
              assert must in paths, f"missing route: {must}"
          print(f"app OK — {len(paths)} routes")

          # no chrome connection happens without a request; ensure the
          # lifespan-pulled pieces at least exist
          from tonearm.audio import broadcaster
          from tonearm.browser import browser
          assert broadcaster is not None and browser is not None
          print("singletons OK")
          EOF

      - name: Config defaults are safe
        run: |
          python - <<'EOF'
          from tonearm.config import config
          assert config.enable_writes is False, "writes must default OFF"
          assert config.audio_enabled is False, "audio must default OFF"
          assert config.strict_bind is False, "bind guard must default to warn-only"
          assert config.api_key == "", "no api key may ship set"
          assert config.store_enabled is False, "store must default OFF"
          assert config.export_interval == 0, "scheduled exports must default OFF"
          print("defaults OK — writes, audio, store and scheduled exports ship disabled; bind guard warn-only")
          EOF

      - name: Response-model conformance (every JSON route is typed)
        run: |
          python - <<'EOF'
          from tonearm.main import app

          # same flattening as the smoke step — _IncludedRouter hides children
          def flatten(routes, prefix=""):
              out = []
              for r in routes:
                  if type(r).__name__ == "_IncludedRouter":
                      p = getattr(r.include_context, "prefix", "") or ""
                      out += flatten(r.original_router.routes, prefix + p)
                  elif getattr(r, "methods", None):
                      out.append((prefix + r.path, r))
              return out

          # streaming / binary / raw surfaces are exempt: SSE, audio bytes,
          # prometheus text, the demo SPA, the amp-api raw passthrough
          # (its shape is whatever Apple's is — typing it would be a lie),
          # and the OBS text overlay (a plain text LINE is the contract).
          # FastAPI's own docs routes (/openapi.json, /docs, /redoc) are
          # framework infrastructure, not part of the API surface.
          EXEMPT_PREFIXES = ("/api/stream", "/api/audio/", "/metrics",
                             "/demo", "/api/amp-api/", "/api/overlay/",
                             "/openapi.json", "/docs", "/redoc")

          untyped = []
          total = 0
          for path, r in flatten(app.routes):
              if "GET" not in (r.methods or set()):
                  continue
              if any(path.startswith(p) for p in EXEMPT_PREFIXES):
                  continue
              total += 1
              if getattr(r, "response_model", None) is None:
                  untyped.append(path)
          assert not untyped, (
              f"{len(untyped)} JSON route(s) without a response_model — "
              f"the OpenAPI page would lie about them: {untyped}")
          print(f"conformance OK — all {total} JSON GET routes declare a response_model")
          EOF

      - name: Unit tests (hermetic — read cache / coalescer)
        run: python -m unittest discover -s tests

      - name: Build the PWA (esbuild — the only npm dep)
        run: |
          # node exists ONLY here (and in the Docker build stage) — the
          # runtime image has none. The bundle must compile for CI to pass.
          npm ci --prefix web || npm install --prefix web --no-audit --no-fund
          node web/build.mjs
          test -f tonearm/web-dist/app.js && test -f tonearm/web-dist/index.html \
            && echo "PWA bundle OK"

      - name: Integration — mock mode serves the full API (no Chrome, no Apple)
        run: |
          TONEARM_MOCK=1 TONEARM_AUTO_CHROME=0 TONEARM_PORT=8971 python -m tonearm \
            > /tmp/mock-server.log 2>&1 &
          echo $! > /tmp/mock-server.pid
          python - <<'EOF'
          import json, time, urllib.request, urllib.error

          base = "http://127.0.0.1:8971"
          for _ in range(60):                     # wait for boot (no Chrome!)
              try:
                  with urllib.request.urlopen(base + "/health", timeout=2) as r:
                      if r.status == 200:
                          break
              except Exception:
                  time.sleep(0.5)
          else:
              raise SystemExit("mock server never came up")
          print("mock server up")

          def get(path):
              # non-2xx EXPECTED in some assertions (honest 501s) — urllib
              # raises HTTPError for those; catch and return the envelope
              try:
                  with urllib.request.urlopen(base + path, timeout=30) as r:
                      return r.status, json.loads(r.read())
              except urllib.error.HTTPError as e:
                  try:
                      return e.code, json.loads(e.read())
                  except Exception:
                      return e.code, {}

          def post(path):
              req = urllib.request.Request(base + path, method="POST",
                                           data=b"")
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, json.loads(r.read())
              except urllib.error.HTTPError as e:
                  try:
                      return e.code, json.loads(e.read())
                  except Exception:
                      return e.code, {}

          def put(path, body):
              req = urllib.request.Request(
                  base + path, method="PUT",
                  data=json.dumps(body).encode(),
                  headers={"Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, json.loads(r.read())
              except urllib.error.HTTPError as e:
                  try:
                      return e.code, json.loads(e.read())
                  except Exception:
                      return e.code, {}

          # every key read surface, route-level, validated by response_model
          # server-side (a 200 IS a model-conformance pass)
          s, j = get("/api/library/songs?limit=5")
          assert s == 200 and j["count"] == 5 and j["items"][0]["attributes"]
          s, j = get("/api/library/search?term=mock")
          assert s == 200 and j
          s, j = get("/api/library/recently-added?limit=3")
          assert s == 200 and len(j["items"]) == 3
          s, j = get("/api/library/diff")
          assert s == 501, "store is off in the mock CI run — honest 501"
          s, j = get("/api/catalog/search?term=mock&types=songs")
          assert s == 200 and j["songs"]
          s, j = get("/api/personal/recommendations")
          assert s == 200 and j["groups"]
          s, j = get("/api/personal/heavy-rotation")
          assert s == 200 and j["items"]
          s, j = get("/api/playback/now-playing")
          assert s == 200 and j["isPlaying"] is True, "mock world is playing"
          s, j = get("/api/playback/queue")
          assert s == 200 and j["items"]
          # queue reorder (#87): whole-list PUT — reverse it, get it back
          ids = [i["id"] for i in j["items"]]
          s, j = put("/api/playback/queue", {"ids": list(reversed(ids))})
          assert s == 200 and j["ok"] is True
          s, j = get("/api/playback/queue")
          assert [i["id"] for i in j["items"]] == list(reversed(ids)), \
              "queue PUT is the whole ordered list — last write wins"
          s, j = post("/api/playback/next")          # state mutates
          assert s == 200 and j["ok"] is True
          s, j = get("/api/write/sweeps/never-played")
          assert s == 200 and j["library_size"] > 0, \
              "sweep PLANS are dry-run read-only — no writes gate on reads"
          s, j = post("/api/write/sweeps/dedupe?execute=1")
          assert s == 501 and j["error"]["code"] == "writes_disabled", \
              "sweep EXECUTION is writes-gated"
          s, j = get("/api/history/recently-played")
          assert s == 501 and j["error"]["code"] == "store_disabled"
          print("mock integration OK — full API surface served, models enforced")
          EOF

          # SSE replay: connect, expect snapshot + updates on the playhead
          timeout 8 python - <<'EOF' || true
          import urllib.request
          got = []
          with urllib.request.urlopen("http://127.0.0.1:8971/api/stream",
                                      timeout=6) as r:
              for raw in r:
                  line = raw.decode().strip()
                  if line.startswith("event:") or line.startswith("data:"):
                      got.append(line)
                  if sum(1 for g in got if g.startswith("data:")) >= 3:
                      break
          assert any(g.startswith("event: snapshot") for g in got), got[:4]
          assert sum(1 for g in got if g.startswith("data:")) >= 3, \
              "SSE must replay events (snapshot + playhead updates)"
          print("SSE replay OK — snapshot + updates streamed")
          EOF

          # OBS overlay serves the state the SSE connection just emitted (#94)
          python - <<'EOF'
          import json, urllib.request
          with urllib.request.urlopen(
                  "http://127.0.0.1:8971/api/overlay/now-playing.json",
                  timeout=10) as r:
              j = json.loads(r.read())
          assert r.status == 200 and j["isPlaying"] is True and j["id"], \
              "overlay serves the stream's last emitted state: %s" % j
          with urllib.request.urlopen(
                  "http://127.0.0.1:8971/api/overlay/now-playing.txt",
                  timeout=10) as r:
              t = r.read().decode()
          assert "None" not in t and t.strip(), t
          print("overlay OK — json + text served from the stream state")
          EOF

          # PWA shell (#84): served from the static mount
          python - <<'EOF'
          import urllib.request
          base = "http://127.0.0.1:8971"
          for path, marker in [("/", "tonearm"), ("/app.js", ""),
                               ("/styles.css", ""), ("/sw.js", "tonearm-shell"),
                               ("/manifest.webmanifest", "tonearm")]:
              with urllib.request.urlopen(base + path, timeout=10) as r:
                  body = r.read().decode(errors="replace")
              assert r.status == 200, (path, r.status)
              if marker:
                  assert marker in body, (path, body[:80])
          print("PWA shell OK — /, app.js, styles.css, sw.js, manifest served")
          EOF
          kill $(cat /tmp/mock-server.pid) 2>/dev/null || true
          sleep 1

          # auth dialect (#90): with a key, the SHELL still loads keylessly
          # and the API 401s — then accepts BOTH dialects
          TONEARM_MOCK=1 TONEARM_AUTO_CHROME=0 TONEARM_PORT=8972 TONEARM_API_KEY=sekrit \
            python -m tonearm > /tmp/mock-keyed.log 2>&1 &
          KEYED=$!
          python - <<'EOF'
          import time, urllib.request, urllib.error
          base = "http://127.0.0.1:8972"
          for _ in range(60):
              try:
                  with urllib.request.urlopen(base + "/health", timeout=2) as r:
                      if r.status == 200: break
              except Exception: time.sleep(0.5)
          else: raise SystemExit("keyed mock server never came up")
          with urllib.request.urlopen(base + "/", timeout=10) as r:      # shell
              assert r.status == 200, "shell must load WITHOUT the key"
          try:                                                           # api
              urllib.request.urlopen(base + "/api/library/songs?limit=1",
                                     timeout=10)
              raise SystemExit("API responded WITHOUT a key — auth leak")
          except urllib.error.HTTPError as e:
              assert e.code == 401, e.code
          for url in (base + "/api/library/songs?limit=1&api_key=sekrit",):
              with urllib.request.urlopen(url, timeout=10) as r:         # query
                  assert r.status == 200, url
          req = urllib.request.Request(                                  # header
              base + "/api/library/songs?limit=1",
              headers={"Authorization": "Bearer sekrit"})
          with urllib.request.urlopen(req, timeout=10) as r:
              assert r.status == 200, "bearer dialect"
          print("auth dialect OK — shell keyless; API 401s, then accepts "
                "?api_key= and Bearer")
          EOF
          kill $KEYED 2>/dev/null || true
          sleep 1
          echo "mock integration step done"
