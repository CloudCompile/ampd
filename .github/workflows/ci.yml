name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Byte-compile every module
        run: python -m compileall -q ampd tests

      - name: Import smoke test (no Chrome needed at import time)
        run: |
          python - <<'EOF'
          from ampd.main import app

          # newer FastAPI nests includes as _IncludedRouter objects; flatten
          def flatten(routes, prefix=""):
              paths = set()
              for r in routes:
                  if type(r).__name__ == "_IncludedRouter":
                      p = getattr(r.include_context, "prefix", "") or ""
                      paths |= flatten(r.original_router.routes, prefix + p)
                  elif getattr(r, "methods", None):
                      paths.add(prefix + r.path)
              return paths

          paths = flatten(app.routes)
          assert len(paths) > 40, f"expected 40+ routes, got {len(paths)}"
          for must in ("/api/library/export", "/api/library/diff",
                       "/api/history/recently-played",
                       "/api/catalog/songs/{song_id}/lyrics",
                       "/api/audio/stream.mp3", "/api/stream", "/demo",
                       "/api/write/sweeps/dedupe", "/api/playback/now-playing",
                       "/api/favorites", "/metrics", "/api/debug"):
              assert must in paths, f"missing route: {must}"
          print(f"app OK — {len(paths)} routes")

          # no chrome connection happens without a request; ensure the
          # lifespan-pulled pieces at least exist
          from ampd.audio import broadcaster
          from ampd.browser import browser
          assert broadcaster is not None and browser is not None
          print("singletons OK")
          EOF

      - name: Config defaults are safe
        run: |
          python - <<'EOF'
          from ampd.config import config
          assert config.enable_writes is False, "writes must default OFF"
          assert config.audio_enabled is False, "audio must default OFF"
          assert config.strict_bind is False, "bind guard must default to warn-only"
          assert config.api_key == "", "no api key may ship set"
          assert config.store_enabled is False, "store must default OFF"
          assert config.export_interval == 0, "scheduled exports must default OFF"
          print("defaults OK — writes, audio, store and scheduled exports ship disabled; bind guard warn-only")
          EOF

      - name: Response-model conformance (every JSON route is typed)
        run: |
          python - <<'EOF'
          from ampd.main import app

          # same flattening as the smoke step — _IncludedRouter hides children
          def flatten(routes, prefix=""):
              out = []
              for r in routes:
                  if type(r).__name__ == "_IncludedRouter":
                      p = getattr(r.include_context, "prefix", "") or ""
                      out += flatten(r.original_router.routes, prefix + p)
                  elif getattr(r, "methods", None):
                      out.append((prefix + r.path, r))
              return out

          # streaming / binary / raw surfaces are exempt: SSE, audio bytes,
          # prometheus text, the demo SPA, and the amp-api raw passthrough
          # (its shape is whatever Apple's is — typing it would be a lie).
          # FastAPI's own docs routes (/openapi.json, /docs, /redoc) are
          # framework infrastructure, not part of the API surface.
          EXEMPT_PREFIXES = ("/api/stream", "/api/audio/", "/metrics",
                             "/demo", "/api/amp-api/", "/openapi.json",
                             "/docs", "/redoc")

          untyped = []
          total = 0
          for path, r in flatten(app.routes):
              if "GET" not in (r.methods or set()):
                  continue
              if any(path.startswith(p) for p in EXEMPT_PREFIXES):
                  continue
              total += 1
              if getattr(r, "response_model", None) is None:
                  untyped.append(path)
          assert not untyped, (
              f"{len(untyped)} JSON route(s) without a response_model — "
              f"the OpenAPI page would lie about them: {untyped}")
          print(f"conformance OK — all {total} JSON GET routes declare a response_model")
          EOF

      - name: Unit tests (hermetic — read cache / coalescer)
        run: python -m unittest discover -s tests
