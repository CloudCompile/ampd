name: Clients

# Generated API clients — built from the REAL OpenAPI schema (the typed
# models made it true, #30/#31). Runs on release tags: the schema is dumped
# from a MOCK server (no Chrome, no Apple needed), TS + Python clients are
# generated, committed to clients/, and attached to the GitHub release.
#
# Generated code is GENERATED: a banner header marks it, hand-edits are
# rejected in review. Client versions track the server release tag (the
# schema's info.version IS the server version — bumped in the release PR).

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install generator tooling
        run: |
          # the app itself (the mock server must boot) + generators
          pip install -r requirements.txt
          pip install openapi-python-client ruff build
        # ruff is NOT optional: the generator's post-gen hook hard-fails
        # without it (output is still written, but the step exits 2)

      - name: Dump the real schema from a mock server (no Chrome, no Apple)
        run: |
          AMPD_MOCK=1 AMPD_AUTO_CHROME=0 AMPD_PORT=8971 python -m ampd \
            > /tmp/mock-server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8971/health > /dev/null && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:8971/openapi.json > /tmp/openapi.json
          SCHEMA_VERSION=$(python -c "import json;print(json.load(open('/tmp/openapi.json'))['info']['version'])")
          echo "CLIENT_VERSION=$SCHEMA_VERSION" >> "$GITHUB_ENV"
          echo "schema dumped — version $SCHEMA_VERSION"

      - name: Generate TypeScript client (types + path functions)
        run: |
          npx --yes openapi-typescript@7 /tmp/openapi.json \
            -o clients/ts/schema.ts
          # GENERATED banner — hand-edits are rejected
          python - <<'EOF'
          banner = (
              "/* GENERATED by .github/workflows/clients.yml from the live\n"
              " * OpenAPI schema — DO NOT EDIT BY HAND. Regenerate on the\n"
              " * next release tag. Auth dialect (baked into the schema):\n"
              " *   Authorization: Bearer <key>   OR   ?api_key=<key>\n"
              " * (the query fallback exists because EventSource cannot\n"
              " *  send headers). Version tracks the server release. */\n")
          p = "clients/ts/schema.ts"
          src = open(p).read()
          if not src.startswith("/* GENERATED"):
              open(p, "w").write(banner + src)
          print("ts client generated with banner")
          EOF
          cat > clients/ts/README.md <<'MD'
          # @cloudcompile/ampd — TS client (GENERATED)

          GENERATED by `.github/workflows/clients.yml` — do not edit by hand.

          ```ts
          import createClient from "./schema";
          // auth is enforced by the server's middleware; both flavors work:
          const headers = { Authorization: "Bearer <your-key>" };
          // or:  new EventSource("/api/stream?api_key=<your-key>")
          ```
          MD

      - name: Generate Python client (packaged, PyPI-ready)
        run: |
          # package name derives from the schema title -> ampd_client /
          # ampd-client (flat layout, no src/); version tracks info.version
          openapi-python-client generate --path /tmp/openapi.json \
            --output-path clients/python --overwrite
          test -f clients/python/ampd_client/client.py
          cat > clients/python/README.md <<'MD'
          # ampd-client (GENERATED)

          GENERATED by `.github/workflows/clients.yml` — do not edit by hand.
          Version tracks the server release tag.

          ```python
          from ampd_client import Client
          client = Client(base_url="http://127.0.0.1:8188")
          # auth dialect (enforced server-side):
          #   headers={"Authorization": "Bearer <key>"}  or  ?api_key=<key>
          ```
          MD

      - name: Package the Python client
        run: |
          pip install build
          (cd clients/python && python -m build --wheel --sdist \
            --outdir dist/ 2>/dev/null) || echo "build backend unavailable — tarball only"
          tar czf "ampd-clients-${CLIENT_VERSION}.tar.gz" -C . clients/

      - name: Commit generated clients (release tags only)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # main is protected — a bot push is declined; the generated change
          # goes up as a PR instead (fast-forward usually, often empty: the
          # generated clients only differ when the API or version changed)
          git config user.name "ampd-clients-bot"
          git config user.email "noreply@github.com"
          git checkout -q -b clients/regen
          git add clients/
          if git diff --cached --quiet; then
            echo "no client changes — the generated code is current"
            exit 0
          fi
          git commit -m "clients: generated from ${GITHUB_REF_NAME} [skip ci]"
          git push -q origin clients/regen
          gh pr create --head clients/regen --base main \
            --title "clients: generated from ${GITHUB_REF_NAME}" \
            --body "Automated regeneration by \`clients.yml\` on the \`${GITHUB_REF_NAME}\` tag. GENERATED code — do not hand-edit. [skip ci]"

      - name: Attach to the release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "ampd-clients-${CLIENT_VERSION}.tar.gz" --clobber || \
            echo "release not found yet — artifact kept in the run"
          ls -la clients/ts clients/python | head -5
