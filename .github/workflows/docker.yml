name: Docker

# Multi-arch images (amd64 + arm64) published to ghcr.io on release tags.
# The Dockerfile is arch-agnostic — chromium, pulseaudio, xvfb and ffmpeg
# all exist in Debian arm64, so no Dockerfile changes were needed.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # QEMU is what makes the arm64 build possible on amd64 runners;
      # buildx drives both platforms in one command.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Docker meta (version + latest tags)"
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build + push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # chromium on arm64 under QEMU is chunky; cache keeps repeat
          # releases from rebuilding the world
          cache-from: type=gha
          cache-to: type=gha,mode=max
