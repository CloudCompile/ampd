# Tidbyt Gen 2 → tonearm: now-playing display + gesture remote.
#
# Flash once over USB (esphome run tidbyt.yaml from any machine with the
# device plugged in, or https://web.esphome.io from Chrome). After that
# it lives on your WiFi and talks straight to tonearm's funnel URL —
# no Tidbyt cloud, no local hub required.
#
# Hardware (Gen 2, pinned by the ESPHome-on-Tidbyt-Gen2 community thread):
#   ESP32 · 64x32 HUB75 matrix · touch pad (GPIO33, capacitive) ·
#   bootloader unlocked.
#
# Gestures (the spec):
#   1 tap            → play/pause toggle
#   2 taps           → next track
#   3 taps           → "back" — restart if >10s into the song, else the
#                      previous track (the RULE lives in tonearm:
#                      POST /api/playback/back — the button stays dumb)
#   hold ~1s         → play playlist 1 (Favorite Songs, in order)
#   hold twice       → play playlist 2 (Heavy Rotation, shuffled)

substitutions:
  # ── filled in for this device ────────────────────────────────────────
  tonearm_base: "http://20.221.210.24/tidbyt-relay"
  tonearm_key: "toneark_jEpy8GG1FBoTt4BApgDgZIZxTlYkpBcq"   # tidbyt, read,write, 120/min
  playlist_1_id: "p.0YU08k07L9"        # Favorite Songs (the hearts playlist)
  playlist_2_id: "p.KoKOBXDS3Wm3o9P"   # Heavy Rotation
  # ─────────────────────────────────────────────────────────────────────

esphome:
  name: tidbyt-nowplaying
  friendly_name: Tidbyt Now Playing
  platformio_options:
    build_flags:
      # HUB75's library defaults to 8-bit planes. This UI is deliberately
      # 1px-stroke/near-monochrome; 2-bit planes cut the DMA framebuffer
      # enough to leave room for I2S1 speaker DMA.
      - "-DFORCE_COLOR_DEPTH=2"
  libraries:
    - "https://github.com/pschatzmann/ESP32-A2DP"
esp32:
  board: esp32dev
  framework:
    type: arduino

external_components:
  - source: github://TillFleisch/ESPHome-HUB75-MatrixDisplayWrapper@main
  - source:
      type: local
      path: external_components
    components: [tidbyt_a2dp]

logger:
api:
  encryption:
    key: !secret api_encryption_key
ota:
  - platform: esphome

http_request:                # hub — the gesture actions + the now-playing poll
  verify_ssl: false          # arduino http_request can't pin certs (IDF-only)

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:                                  # never orphaned: falls back to a
    ssid: "tidbyt-setup"               # setup hotspot if the wifi's gone
    password: "tidbytsetup"            # explicit WPA password; open APs
                                       # are rejected by some ChromeOS/phones

captive_portal:                        # first-boot WiFi provisioning portal

# ── the display: minimal 1px-stroke CarPlay player ─────────────────────
# No backdrop. Static clipped text (title/album/artist), a small progress
# bar + elapsed time, and a right tile that shows album art — or synced
# lyrics (previous dim / current bright / next dim) when available.
# All text renders from a hand-rolled 3x5 pixel font drawn with 1px
# strokes — no TTF downloads, no glyph atlases.

# Bluetooth Classic A2DP source: the ESP32 sends the raw PCM relay to the
# Bose Mini II SoundLink. No onboard I2S speaker and no I2S1 DMA allocation.
tidbyt_a2dp:
  id: bose_source
  device_name: "Bose Mini II SoundLink"
  url: "${tonearm_base}/api/audio/stream.pcm?api_key=${tonearm_key}"

online_image:
  - id: artwork
    url: "http://placeholder/art.jpg"   # replaced at runtime via set_url
    format: JPEG
    type: RGB565
    resize: 24x24
    update_interval: never          # we set_url + update on track change

select:
  - platform: template
    id: display_mode
    name: "Display mode"
    optimistic: true
    restore_value: true
    options:
      - auto
      - artwork
      - lyrics
    initial_option: auto

globals:
  - id: np_title_state
    type: std::string
    initial_value: '"starting up"'
  - id: np_album_state
    type: std::string
    initial_value: '"tonearm"'
  - id: np_artist_state
    type: std::string
    initial_value: '""'
  - id: np_time_state
    type: std::string
    initial_value: '"0:00"'
  - id: np_elapsed
    type: float
    initial_value: '0'
  - id: np_duration
    type: float
    initial_value: '0'
  - id: np_playing
    type: bool
    initial_value: 'false'
  - id: np_has_art
    type: bool
    initial_value: 'false'
  - id: np_song_id
    type: std::string
    initial_value: '""'
  - id: last_art
    type: std::string
    initial_value: '""'
  - id: lyric_times
    type: std::vector<int>
    initial_value: 'std::vector<int>()'
  - id: lyric_lines
    type: std::vector<std::string>
    initial_value: 'std::vector<std::string>()'

interval:
  - interval: 5s
    then:
    - http_request.get:
        url: "${tonearm_base}/api/playback/now-playing?api_key=${tonearm_key}"
        capture_response: true
        request_headers:
          Content-Type: "application/json"
        on_response:
          then:
            - lambda: |-
                // on_response receives (response, body) — the trigger is
                // Trigger<shared_ptr<HttpContainer>, string&> (checked in
                // the 2025.8.0 source); status first, then parse body
                if (response->status_code != 200) return;
                json::parse_json(body, [](JsonObject root) {
                  id(np_title_state) = std::string(root["title"] | "(idle)");
                  id(np_album_state) = std::string(root["album"] | "");
                  id(np_artist_state) = std::string(root["artist"] | "");
                  id(np_elapsed) = root["elapsedMs"] | 0;
                  id(np_duration) = root["durationMs"] | 0;
                  id(np_playing) = root["isPlaying"] | false;
                  std::string song = std::string(root["id"] | "");
                  id(np_song_id) = song;
                  int secs = (int)(id(np_elapsed) / 1000.0f);
                  char clock[8];
                  snprintf(clock, sizeof(clock), "%d:%02d", secs / 60, secs % 60);
                  id(np_time_state) = std::string(clock);
                  // album art: ask Apple for a small variant (96px) and
                  // refresh the online_image only when the art changed
                  std::string art = std::string(root["artworkUrl"] | "");
                  if (!art.empty() && art != id(last_art)) {
                    id(last_art) = art;
                    // Fetch the tile through tonearm's plain HTTP relay;
                    // the ESP32 cannot afford Apple's HTTPS handshake.
                    id(artwork)->set_url(
                      "${tonearm_base}/api/playback/artwork-tile?api_key=${tonearm_key}");
                    id(artwork)->update();
                  }
                  return true;
                });

# Lyrics are fetched periodically and kept as compact timestamp/text arrays.
# Auto mode uses lyrics when this array is non-empty; otherwise art remains.
  - interval: 15s
    then:
      - if:
          condition:
            lambda: 'return !id(np_song_id).empty();'
          then:
            - http_request.get:
                url: !lambda |-
                  return std::string("${tonearm_base}/api/catalog/songs/") +
                    id(np_song_id) + "/lyrics?api_key=${tonearm_key}";
                capture_response: true
                request_headers:
                  Content-Type: "application/json"
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code != 200) return;
                        json::parse_json(body, [](JsonObject root) {
                          id(lyric_times).clear();
                          id(lyric_lines).clear();
                          for (JsonObject line : root["lines"].as<JsonArray>()) {
                            id(lyric_times).push_back(line["timeMs"] | 0);
                            id(lyric_lines).push_back(std::string(line["text"] | ""));
                          }
                          return true;
                        });

display:
  - platform: hub75_matrix_display
    id: matrix
    driver: FM6126A
    i2sspeed: HZ_8M
    clock_phase: false
    latch_blanking: 1
    width: 64
    height: 32
    R1_pin: 5
    G1_pin: 23
    B1_pin: 4
    R2_pin: 2
    G2_pin: 22
    B2_pin: 32
    A_pin: 25
    B_pin: 21
    C_pin: 26
    D_pin: 19
    LAT_pin: 18
    OE_pin: 27
    CLK_pin: 15
    update_interval: 50ms            # 20 FPS: calmer, lower bus pressure
    lambda: |-
      // ── 3x5 pixel font, drawn with 1px strokes ──
      // Each glyph: 5 rows x 3 bits (MSB of each row = left column).
      static const uint16_t F35[] = { 0x2BED, 0x6BAE, 0x3923, 0x6B6E, 0x79A7, 0x79A4, 0x396B, 0x5BED, 0x7497, 0x126A, 0x5BAD, 0x4927, 0x5FED, 0x5FFD, 0x2B6A, 0x6BA4, 0x2B51, 0x6BAD, 0x388E, 0x7492, 0x5B6F, 0x5B6A, 0x5BFD, 0x5AAD, 0x5A92, 0x72A7, 0x7B6F, 0x2C97, 0x73E7, 0x72CF, 0x5BC9, 0x79CF, 0x79EF, 0x7252, 0x7BEF, 0x7BCF, 0x0410, 0x01C0, 0x0002, 0x0014, 0x2400, 0x68AB, 0x2482, 0x6280, 0x12A4, 0x1491, 0x4494, 0x05D0, 0x0000 };
      static const char ORDER[] =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789:-.'!?/()&+ ";

      auto draw3x5 = [&](int x, int y, const std::string &txt,
                         bool bright, bool bold) {
        for (char ch : txt) {
          int idx = -1;
          if (ch >= 'A' && ch <= 'Z') idx = ch - 'A';
          else if (ch >= 'a' && ch <= 'z') idx = ch - 'a';
          else if (ch >= '0' && ch <= '9') idx = 26 + ch - '0';
          else if (ch == ':') idx = 36;
          else if (ch == '-') idx = 37;
          else if (ch == '.') idx = 38;
          else if (ch == ',') idx = 39;
          else if (ch == '\'') idx = 40;
          else if (ch == '&') idx = 41;
          else if (ch == '!') idx = 42;
          else if (ch == '?') idx = 43;
          else if (ch == '/') idx = 44;
          else if (ch == '(') idx = 45;
          else if (ch == ')') idx = 46;
          else if (ch == '+') idx = 47;
          else if (ch == ' ') idx = 48;
          if (idx < 0) { x += 4; continue; }
          uint16_t g = F35[idx];
          for (int row = 0; row < 5; row++) {
            for (int col = 0; col < 3; col++) {
              bool on = g & (0x4000 >> (row * 3 + col));
              if (!on) continue;
              it.draw_pixel_at(x + col, y + row, bright ? Color(245, 245, 245) : Color(90, 90, 90));
              if (bold) it.draw_pixel_at(x + col + 1, y + row, bright ? Color(245, 245, 245) : Color(90, 90, 90));
            }
          }
          x += bold ? 5 : 4;
        }
      };

      it.fill(Color::BLACK);

      // ── left column (0-38): static clipped text ──
      std::string title = id(np_title_state);
      std::string album = id(np_album_state);
      std::string artist = id(np_artist_state);
      auto clip = [](std::string s, size_t n) {
        if (s.length() > n) return s.substr(0, n - 1) + ".";
        return s;
      };
      draw3x5(1, 1, clip(title, 9), true, false);    // title: brightest
      draw3x5(1, 9, clip(album, 9), false, false);   // album: dim
      draw3x5(1, 17, clip(artist, 9), false, false); // artist: dim

      // ── progress bar + elapsed time ──
      float frac = (id(np_duration) > 0)
        ? id(np_elapsed) / id(np_duration) : 0.0f;
      it.rectangle(1, 27, 20, 4, id(dim_white));
      if (frac > 0) it.filled_rectangle(1, 27, (int)(frac * 20), 4, id(accent));
      draw3x5(24, 26, id(np_time_state), true, false);

      // ── right tile (40-63): album art or lyrics ──
      bool lyrics_mode = id(display_mode).state == "lyrics" ||
        (id(display_mode).state == "auto" && !id(lyric_lines).empty());
      if (lyrics_mode && !id(lyric_lines).empty()) {
        // lyrics tile: previous dim / current bright+bold / next dim
        int current = -1;
        for (size_t i = 0; i < id(lyric_times).size(); i++) {
          if (id(lyric_times)[i] <= id(np_elapsed)) current = (int)i;
        }
        int prev = current - 1, next = current + 1;
        if (prev >= 0) draw3x5(41, 7, clip(id(lyric_lines)[prev], 5), false, false);
        if (current >= 0) draw3x5(41, 14, clip(id(lyric_lines)[current], 5), true, true);
        if (next >= 0 && next < (int)id(lyric_lines).size())
          draw3x5(41, 22, clip(id(lyric_lines)[next], 5), false, false);
      } else if (id(np_has_art)) {
        it.image(40, 4, id(artwork));
      } else {
        draw3x5(41, 14, "no art", false, false);
      }

color:
  - id: accent
    red: 100%
    green: 100%
    blue: 100%                 # monochrome display
  - id: dim_white
    red: 38%
    green: 38%
    blue: 38%

switch:
  - platform: hub75_matrix_display
    matrix_id: matrix
    name: "Display power"
    restore_mode: ALWAYS_ON
    id: power

number:
  - platform: hub75_matrix_display
    matrix_id: matrix
    name: "Brightness"
    initial_value: 32

# ── the touch pad: the whole remote ────────────────────────────────────
esp32_touch:
  setup_mode: false

binary_sensor:
  - platform: esp32_touch
    name: "Top pad"
    id: pad
    pin: GPIO33
    threshold: 1200
    filters:
      - delayed_on: 10ms
    on_multi_click:
      # — 1 tap: play/pause ——————————————————————————————
      - timing:
          - ON for at most 0.35s
          - OFF for at least 0.45s        # window closes: it was ONE tap
        then:
          - http_request.post:
              url: "${tonearm_base}/api/playback/toggle?api_key=${tonearm_key}"
      # — 2 taps: next ———————————————————————————————————
      - timing:
          - ON for at most 0.35s
          - OFF for 0.1s to 0.4s
          - ON for at most 0.35s
          - OFF for at least 0.45s
        then:
          - http_request.post:
              url: "${tonearm_base}/api/playback/next?api_key=${tonearm_key}"
      # — 3 taps: back (restart if >10s, else previous) ——
      - timing:
          - ON for at most 0.35s
          - OFF for 0.1s to 0.4s
          - ON for at most 0.35s
          - OFF for 0.1s to 0.4s
          - ON for at most 0.35s
          - OFF for at least 0.45s
        then:
          - http_request.post:
              url: "${tonearm_base}/api/playback/back?threshold_ms=10000&api_key=${tonearm_key}"
      # — hold ~1s (and release): FAVORITES, in order ————
      - timing:
          - ON for 0.8s to 2.5s
          - OFF for at least 0.4s
        then:
          - http_request.post:
              url: "${tonearm_base}/api/playback/shuffle/off?api_key=${tonearm_key}"
          - http_request.post:
              url: "${tonearm_base}/api/playback/play-collection?kind=playlist&id=${playlist_1_id}&api_key=${tonearm_key}"
      # — hold, release, hold again: HEAVY ROTATION, shuffled ————
      - timing:
          - ON for 0.8s to 2.5s
          - OFF for 0.1s to 0.4s
          - ON for 0.8s to 2.5s
          - OFF for at least 0.4s
        then:
          - http_request.post:
              url: "${tonearm_base}/api/playback/shuffle/on?api_key=${tonearm_key}"
          - http_request.post:
              url: "${tonearm_base}/api/playback/play-collection?kind=playlist&id=${playlist_2_id}&api_key=${tonearm_key}"
