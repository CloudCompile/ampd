# Tidbyt Gen 2 → tonearm: now-playing display + speaker + gesture remote.
#
# Flash once over USB (esphome run tidbyt.yaml from any machine with the
# device plugged in, or https://web.esphome.io from Chrome). After that
# it lives on your WiFi and talks straight to tonearm's funnel URL —
# no Tidbyt cloud, no local hub required.
#
# Hardware (Gen 2, pinned by the ESPHome-on-Tidbyt-Gen2 community thread):
#   ESP32-S3 · 64x32 HUB75 matrix · I2S speaker (GPIO12/13/14) · touch pad
#   (GPIO33, capacitive) · bootloader unlocked.
#
# Gestures (the spec):
#   1 tap            → play/pause toggle
#   2 taps           → next track
#   3 taps           → "back" — restart if >10s into the song, else the
#                      previous track (the RULE lives in tonearm:
#                      POST /api/playback/back — the button stays dumb)
#   hold ~1s         → play playlist 1
#   hold twice       → play playlist 2   (two ≥1s holds, released quickly)

substitutions:
  # ── filled in for this device ────────────────────────────────────────
  tonearm_base: "https://remote.tail4c21bf.ts.net:8443"
  tonearm_key: "toneark_jEpy8GG1FBoTt4BApgDgZIZxTlYkpBcq"   # tidbyt, read,write, 120/min
  # hold ~1s → favorites, in order
  playlist_1_id: "p.0YU08k07L9"        # Favorite Songs (the hearts playlist)
  # hold twice → heavy rotation, SHUFFLED (shuffle flips on before play;
  # the favorites hold flips it back off — each button is deterministic)
  playlist_2_id: "p.KoKOBXDS3Wm3o9P"   # Heavy Rotation
  # ─────────────────────────────────────────────────────────────────────

esphome:
  name: tidbyt-nowplaying
  friendly_name: Tidbyt Now Playing
  on_boot:
    priority: 600                      # after wifi+api, before loops
    then:
      # the speaker IS the tonearm stream: start listening on boot and
      # keep it (tonearm's lazy pipeline wakes on first listener —
      # silence when idle, live the moment something plays)
      - media_player.play_media:
          id: speaker
          media_url: "${tonearm_base}/api/audio/stream.mp3?api_key=${tonearm_key}"
      - media_player.volume_set:
          id: speaker
          volume: 80%

esp32:
  board: esp32dev
  framework:
    type: arduino

external_components:
  - source: github://TillFleisch/ESPHome-HUB75-MatrixDisplayWrapper@main

logger:
api:
  encryption:
    key: !secret api_encryption_key    # esphome generates on first run
ota:
  - platform: esphome

http_request:                # hub — the gesture actions + the now-playing poll
  # arduino-framework http_request can't pin certs (IDF-only) — the key
  # is the auth, and the device lives on the home LAN. Note in README.
  verify_ssl: false

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:                                  # never orphaned: falls back to a
    ssid: "tidbyt-setup"               # setup hotspot if the wifi's gone

captive_portal:                        # first boot: join "tidbyt-setup",
                                       # pick your WiFi in the portal

# ── the speaker ────────────────────────────────────────────────────────
i2s_audio:
  - id: i2s_out
    i2s_lrclk_pin: GPIO13             # WS / LRC
    i2s_bclk_pin: GPIO12              # SCK / BCLK

media_player:
  - platform: i2s_audio
    id: speaker
    name: tonearm speaker
    dac_type: external
    i2s_dout_pin: GPIO14
    mode: mono

# ── the display: static CarPlay-style player ───────────────────────────
# The player never scrolls. Album artwork is a full-screen low-resolution
# background; the foreground is a readable 38px text column plus a 24px
# right tile that automatically becomes synced lyrics when available.
text_sensor:
  - platform: template
    id: np_title
    lambda: 'return {id(np_title_state)};'
  - platform: template
    id: np_artist
    lambda: 'return {id(np_artist_state)};'

# Background is intentionally low-res: it produces a soft/pixelated wash
# across the matrix without storing a large bitmap on the ESP32.
online_image:
  - id: background_art
    url: "http://placeholder/background.jpg"
    format: JPEG
    type: RGB565
    resize: 64x32
    update_interval: never
  - id: artwork
    url: "http://placeholder/art.jpg"
    format: JPEG
    type: RGB565
    resize: 24x24
    update_interval: never

web_server:
  port: 80

select:
  - platform: template
    id: display_mode
    name: "Display mode"
    optimistic: true
    restore_value: true
    options:
      - auto
      - artwork
      - lyrics
    initial_option: auto

globals:
  - id: np_title_state
    type: std::string
    initial_value: '"starting up"'
  - id: np_album_state
    type: std::string
    initial_value: '"tonearm"'
  - id: np_artist_state
    type: std::string
    initial_value: '""'
  - id: np_time_state
    type: std::string
    initial_value: '"0:00"'
  - id: np_elapsed
    type: float
    initial_value: '0'
  - id: np_duration
    type: float
    initial_value: '0'
  - id: np_playing
    type: bool
    initial_value: 'false'
  - id: np_has_art
    type: bool
    initial_value: 'false'
  - id: np_song_id
    type: std::string
    initial_value: '""'
  - id: last_art
    type: std::string
    initial_value: '""'
  - id: last_background
    type: std::string
    initial_value: '""'
  - id: lyric_times
    type: std::vector<int>
    initial_value: '{}'
  - id: lyric_lines
    type: std::vector<std::string>
    initial_value: '{}'

# Current metadata and art. The player remains static; only the right tile
# changes between art and lyrics.
interval:
  - interval: 5s
    then:
      - http_request.get:
          url: "${tonearm_base}/api/playback/now-playing?api_key=${tonearm_key}"
          capture_response: true
          request_headers:
            Content-Type: "application/json"
          on_response:
            then:
              - lambda: |-
                  if (response->status_code != 200) return;
                  json::parse_json(body, [](JsonObject root) {
                    id(np_title_state) = std::string(root["title"] | "(idle)");
                    id(np_album_state) = std::string(root["album"] | "");
                    id(np_artist_state) = std::string(root["artist"] | "");
                    id(np_elapsed) = root["elapsedMs"] | 0;
                    id(np_duration) = root["durationMs"] | 0;
                    id(np_playing) = root["isPlaying"] | false;
                    std::string song = std::string(root["id"] | "");
                    id(np_song_id) = song;
                    int secs = (int)(id(np_elapsed) / 1000.0f);
                    char clock[8];
                    snprintf(clock, sizeof(clock), "%d:%02d", secs / 60, secs % 60);
                    id(np_time_state) = std::string(clock);
                    std::string art = std::string(root["artworkUrl"] | "");
                    if (art.empty()) return true;
                    size_t pos = art.find("600x600");
                    if (pos != std::string::npos) art.replace(pos, 7, "96x96");
                    id(np_has_art) = true;
                    if (art != id(last_art)) {
                      id(last_art) = art;
                      id(artwork)->set_url(art);
                      id(artwork)->update();
                    }
                    // The same image is used as a deliberately low-res
                    // full-panel background. It is not a second large bitmap.
                    if (art != id(last_background)) {
                      id(last_background) = art;
                      id(background_art)->set_url(art);
                      id(background_art)->update();
                    }
                    return true;
                  });

# Lyrics are fetched periodically and kept as compact timestamp/text arrays.
# Auto mode uses lyrics when this array is non-empty; otherwise art remains.
  - interval: 15s
    then:
      - if:
          condition:
            lambda: 'return !id(np_song_id).empty();'
          then:
            - http_request.get:
                url: !lambda |-
                  return std::string("${tonearm_base}/api/catalog/songs/") +
                    id(np_song_id) + "/lyrics?api_key=${tonearm_key}";
                capture_response: true
                request_headers:
                  Content-Type: "application/json"
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code != 200) return;
                        json::parse_json(body, [](JsonObject root) {
                          id(lyric_times).clear();
                          id(lyric_lines).clear();
                          for (JsonObject line : root["lines"].as<JsonArray>()) {
                            id(lyric_times).push_back(line["timeMs"] | 0);
                            id(lyric_lines).push_back(std::string(line["text"] | ""));
                          }
                        });

display:
  - platform: hub75_matrix_display
    id: matrix
    driver: FM6126A
    i2sspeed: HZ_10M
    clock_phase: false
    latch_blanking: 1
    width: 64
    height: 32
    R1_pin: 5
    G1_pin: 23
    B1_pin: 4
    R2_pin: 2
    G2_pin: 22
    B2_pin: 32
    A_pin: 25
    B_pin: 21
    C_pin: 26
    D_pin: 19
    LAT_pin: 18
    OE_pin: 27
    CLK_pin: 15
    update_interval: 16ms
    lambda: |-
      // Full image wash first. Text and the right tile sit over it.
      if (id(np_has_art)) it.image(0, 0, id(background_art));
      else it.fill(Color::BLACK);

      // Static left-side metadata. Fit to the 38px column by clipping
      // characters rather than moving the title around.
      std::string title = id(np_title_state);
      std::string album = id(np_album_state);
      std::string artist = id(np_artist_state);
      if (title.length() > 8) title = title.substr(0, 7) + ".";
      if (album.length() > 8) album = album.substr(0, 7) + ".";
      if (artist.length() > 8) artist = artist.substr(0, 7) + ".";
      it.printf(0, 0, id(roboto8), "%s", title.c_str());
      it.printf(0, 8, id(roboto8), "%s", album.c_str());
      it.printf(0, 16, id(roboto8), "%s", artist.c_str());

      float frac = (id(np_duration) > 0)
        ? id(np_elapsed) / id(np_duration) : 0.0f;
      it.rectangle(0, 27, 25, 30, id(dim_white));
      if (frac > 0) it.filled_rectangle(0, 27, (int)(frac * 25), 30, id(accent));
      it.printf(28, 25, id(roboto5), "%s", id(np_time_state).c_str());

      bool lyrics_mode = id(display_mode).state == "lyrics" ||
        (id(display_mode).state == "auto" && !id(lyric_lines).empty());
      if (!lyrics_mode && id(np_has_art)) {
        it.image(40, 4, id(artwork));
      } else if (lyrics_mode && !id(lyric_lines).empty()) {
        int current = -1;
        for (size_t i = 0; i < id(lyric_times).size(); i++) {
          if (id(lyric_times)[i] <= id(np_elapsed)) current = (int)i;
        }
        if (current >= 0) {
          int prev = current - 1;
          int next = current + 1;
          if (prev >= 0) it.printf(41, 5, id(roboto5), "%s", id(lyric_lines)[prev].c_str());
          it.printf(41, 13, id(roboto6bold), "%s", id(lyric_lines)[current].c_str());
          if (next < (int)id(lyric_lines).size()) it.printf(41, 23, id(roboto5), "%s", id(lyric_lines)[next].c_str());
        }
      } else {
        it.printf(42, 14, id(roboto5), "no lyrics");
      }
      // restrained playback pulse: the background becomes slightly brighter
      // while playing. The next revision can replace this with an RMS meter
      // from the audio pipeline without changing the layout.
      if (id(np_playing) && ((millis() / 120) % 8) < 2)
        it.filled_rectangle(0, 31, 63, 31, id(accent));

font:
  - file: "gfonts://Roboto"
    id: roboto8
    size: 8
  - file: "gfonts://Roboto"
    id: roboto6bold
    size: 6
    bold: true
  - file: "gfonts://Roboto"
    id: roboto5
    size: 5

color:
  - id: accent
    red: 98%
    green: 18%
    blue: 28%
  - id: dim_white
    red: 30%
    green: 30%
    blue: 30%


# ── the touch pad: the whole remote ────────────────────────────────────
esp32_touch:
  setup_mode: false

binary_sensor:
  - platform: esp32_touch
    name: "Top pad"
    id: pad
    pin: GPIO33
    threshold: 1200
    filters:
      - delayed_on: 10ms
    on_multi_click:
      # — 1 tap: play/pause ——————————————————————————————
      - timing:
          - ON for at most 0.35s
          - OFF for at least 0.45s        # window closes: it was ONE tap
        then:
          - http_request.post:
              url: "${tonearm_base}/api/playback/toggle?api_key=${tonearm_key}"
      # — 2 taps: next ———————————————————————————————————
      - timing:
          - ON for at most 0.35s
          - OFF for 0.1s to 0.4s
          - ON for at most 0.35s
          - OFF for at least 0.45s
        then:
          - http_request.post:
              url: "${tonearm_base}/api/playback/next?api_key=${tonearm_key}"
      # — 3 taps: back (restart if >10s, else previous) ——
      - timing:
          - ON for at most 0.35s
          - OFF for 0.1s to 0.4s
          - ON for at most 0.35s
          - OFF for 0.1s to 0.4s
          - ON for at most 0.35s
          - OFF for at least 0.45s
        then:
          - http_request.post:
              url: "${tonearm_base}/api/playback/back?threshold_ms=10000&api_key=${tonearm_key}"
      # — hold ~1s (and release): FAVORITES, in order ————
      - timing:
          - ON for 0.8s to 2.5s
          - OFF for at least 0.4s
        then:
          - http_request.post:
              url: "${tonearm_base}/api/playback/shuffle/off?api_key=${tonearm_key}"
          - http_request.post:
              url: "${tonearm_base}/api/playback/play-collection?kind=playlist&id=${playlist_1_id}&api_key=${tonearm_key}"
      # — hold, release, hold again: HEAVY ROTATION, shuffled ————
      - timing:
          - ON for 0.8s to 2.5s
          - OFF for 0.1s to 0.4s
          - ON for 0.8s to 2.5s
          - OFF for at least 0.4s
        then:
          - http_request.post:
              url: "${tonearm_base}/api/playback/shuffle/on?api_key=${tonearm_key}"
          - http_request.post:
              url: "${tonearm_base}/api/playback/play-collection?kind=playlist&id=${playlist_2_id}&api_key=${tonearm_key}"

# the device key is read,write scoped and rate-capped in tonearm's
# registry — revoke it with `python3 -m tonearm keys revoke k-…` and the
# pad goes silent (display keeps polling with the same key; give it a
# second read-only key if you want display-only mode).
