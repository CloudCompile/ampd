# Tidbyt remote-development bootstrap.
#
# Intentionally boring: WiFi, encrypted ESPHome API, fallback AP, and
# device-initiated OTA polling. No HUB75, image decoder, audio, Bluetooth,
# web server, lyrics, or touch logic. Install this once over USB; later
# firmware can be delivered outbound from the VPS without inbound OTA.

substitutions:
  update_manifest: "http://20.221.210.24/tidbyt-updates/bootstrap/manifest.json"
  device_key: "toneark_jEpy8GG1FBoTt4BApgDgZIZxTlYkpBcq"

esphome:
  name: tidbyt-bootstrap
  friendly_name: Tidbyt Remote Bootstrap
  project:
    name: cloudcompile.tonearm_tidbyt
    version: "0.1.1"
  on_boot:
    priority: -100
    then:
      - delay: 15s
      - script.execute: report_status

script:
  - id: report_status
    mode: restart
    then:
      - http_request.post:
          url: "http://20.221.210.24/tidbyt-relay/api/device/tidbyt/report?api_key=${device_key}"
          request_headers:
            Content-Type: "application/json"
          json:
            device: "tidbyt-nowplaying"
            version: "0.1.1"
            ip: !lambda 'return WiFi.localIP().toString();'
            wifi_rssi: !lambda 'return std::to_string(WiFi.RSSI());'
            free_heap: !lambda 'return std::to_string(ESP.getFreeHeap());'
            uptime_s: !lambda 'return std::to_string(millis() / 1000);'
            reset_reason: !lambda 'return std::to_string((int) esp_reset_reason());'
            ota_status: "bootstrap-active"
            state: "remote-management-ready"
      - delay: 60s
      - script.execute: report_status

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
  - platform: http_request

http_request:
  verify_ssl: false

# The device checks outbound every five minutes and installs a newer
# OTA-format image automatically. The manifest is served from the VPS's
# plain relay because this tiny ESP32 cannot afford TLS beside future
# display/audio builds. MD5 prevents truncated/corrupt downloads; the
# path is private/unlisted and the VPS controls what gets published.
update:
  - platform: http_request
    id: remote_firmware
    name: "Remote Firmware"
    source: "${update_manifest}"
    update_interval: 5min
    on_update_available:
      then:
        - update.perform:
            id: remote_firmware

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "tidbyt-setup"
    password: "tidbytsetup"

captive_portal:
