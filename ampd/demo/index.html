<!doctype html>
<!-- ampd demo — a minimal custom UI built entirely on the public API.
     Live state via EventSource /api/stream; actions via plain fetch calls.
     This is the whole point of the streaming API: ~100 lines and you have
     a remote control for your Apple Music account. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ampd demo</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  body {
    font: 15px/1.4 system-ui, sans-serif; background: #131316; color: #eee;
    display: grid; place-items: center; min-height: 100vh;
  }
  .card {
    width: min(420px, 92vw); background: #1d1d21; border-radius: 16px;
    padding: 22px; box-shadow: 0 8px 40px #0008;
  }
  .art {
    width: 100%; aspect-ratio: 1; border-radius: 10px; background: #26262b;
    object-fit: cover; display: block;
  }
  .art.empty::after { content: '♫'; display: grid; place-items: center;
    height: 100%; font-size: 72px; color: #3a3a40; }
  h1 { font-size: 19px; margin: 14px 0 2px; white-space: nowrap;
       overflow: hidden; text-overflow: ellipsis; }
  .by { color: #9a9aa2; font-size: 14px; white-space: nowrap;
        overflow: hidden; text-overflow: ellipsis; }
  .bar { height: 5px; background: #2c2c31; border-radius: 3px; margin: 14px 0 4px; }
  .bar > div { height: 100%; width: 0; background: #fa4d56; border-radius: 3px; }
  .times { display: flex; justify-content: space-between; color: #77777f;
           font-size: 11px; font-variant-numeric: tabular-nums; }
  .controls { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
  button {
    background: #2c2c31; color: #eee; border: 0; border-radius: 10px;
    padding: 10px 14px; font-size: 15px; cursor: pointer;
  }
  button:hover { background: #3a3a41; }
  .big { flex: 1; padding: 12px; font-size: 17px; }
  input[type=range] { flex: 1; accent-color: #fa4d56; }
  .row { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  .state { font-size: 11px; color: #77777f; }
  .state b { color: #4ade80; }
  #queue { margin-top: 14px; max-height: 180px; overflow-y: auto;
           font-size: 13px; color: #b9b9c0; }
  #queue div { padding: 4px 6px; border-radius: 6px; }
  #queue div.now { background: #2a2a30; color: #fff; }
  .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .1em;
         color: #66666e; margin-top: 16px; }
  /* lyrics panel (#91 reference implementation) */
  #lyrics { margin-top: 12px; max-height: 220px; overflow-y: auto;
            font-size: 14px; line-height: 1.9; color: #55555e; }
  #lyrics .active { color: #fff; font-weight: 600; transition: color .25s; }
  .lyrrow { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .lyrrow button { padding: 4px 8px; font-size: 11px; }
  .lyrrow span { font-size: 11px; color: #77777f; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="card">
  <div id="art" class="art"></div>
  <h1 id="title">—</h1>
  <div class="by" id="artist">&nbsp;</div>

  <div class="bar"><div id="fill"></div></div>
  <div class="times"><span id="elapsed">0:00</span><span id="dur">0:00</span></div>

  <div class="controls">
    <button id="prev" title="previous">⏮</button>
    <button id="play" class="big" title="play/pause">▶</button>
    <button id="next" title="next">⏭</button>
  </div>
  <div class="row">
    <span class="state">● <b id="link">live</b></span>
    <input type="range" id="vol" min="0" max="1" step="0.01">
    <button id="listen" title="hear the music (streams from the server)">🔇</button>
  </div>

  <div class="lbl">queue</div>
  <div id="queue"></div>

  <div class="lyrrow">
    <div class="lbl" style="margin-top:0">lyrics</div>
    <button id="lyricsToggle" title="synced lyrics — see docs/lyrics-contract.md">show</button>
    <span>offset <b id="off">0</b>ms</span>
    <button id="offMinus">−</button><button id="offPlus">+</button>
  </div>
  <div id="lyrics" hidden></div>
</div>

<script>
const $ = id => document.getElementById(id);
const fmt = ms => { if (ms == null) return '0:00';
  const s = Math.round(ms/1000);
  return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); };

let playing = false;

function render(d) {
  if (d.title != null) {
    $('title').textContent = d.title || '—';
    $('artist').textContent = [d.artist, d.album].filter(Boolean).join(' — ');
    $('art').style.backgroundImage = d.artworkUrl ? `url(${d.artworkUrl})` : 'none';
    $('art').style.backgroundSize = 'cover';
    $('dur').textContent = fmt(d.durationMs);
  }
  playing = !!d.isPlaying;
  $('play').textContent = playing ? '⏸' : '▶';
  if (d.elapsedMs != null && d.durationMs)
    $('fill').style.width = (100 * d.elapsedMs / d.durationMs) + '%';
  $('elapsed').textContent = fmt(d.elapsedMs);
  if (d.volume != null) $('vol').value = d.volume;
  if (d.queue) {
    $('queue').innerHTML = d.queue.map(t =>
      `<div class="${t.title === d.title ? 'now' : ''}">${t.title || t.id}</div>`).join('');
  }
}

async function api(path, method = 'POST') {
  await fetch('/api/playback/' + path, { method });
  if (method === 'GET') render(await (await fetch('/api/playback/' + path)).json());
}

$('play').onclick = () => api(playing ? 'pause' : 'play');
$('next').onclick = () => api('next');
$('prev').onclick = () => api('previous');
$('vol').onchange = e => api('volume/' + e.target.value);
// hear it: the server's audio output as a live mp3 (~1-2s behind the playhead)
const audioEl = new Audio(); audioEl.preload = 'none';
$('listen').onclick = () => {
  if (!audioEl.src) {
    audioEl.src = '/api/audio/stream.mp3';
    audioEl.play();
    $('listen').textContent = '🔊';
  } else if (audioEl.paused) {
    audioEl.play(); $('listen').textContent = '🔊';
  } else {
    audioEl.pause(); $('listen').textContent = '🔇';
  }
};
setInterval(() => api('now-playing', 'GET'), 5000);   // keep progress fresh

// live stream: one EventSource drives the whole UI
function connect() {
  const es = new EventSource('/api/stream');
  es.addEventListener('snapshot', e => { sseState = JSON.parse(e.data);
    render(sseState); loadLyrics(sseState.id); });
  es.addEventListener('update',   e => { sseState = JSON.parse(e.data);
    render(sseState); loadLyrics(sseState.id); });
  es.onerror = () => {
    $('link').textContent = 'reconnecting…';
    $('link').style.color = '#f87171';
    es.close(); setTimeout(connect, 2000);
  };
  es.onopen = () => { $('link').textContent = 'live'; $('link').style.color = '#4ade80'; };
}
connect();

/* ---------------- lyrics — reference implementation of the contract
   documented in docs/lyrics-contract.md (#91). The math:
   active_line = last line with timeMs <= interpolatedElapsed + offsetMs.
   The SSE events carry (id, elapsedMs, durationMs, ts, isPlaying); the
   client interpolates between events and only fetches lyrics per id. */

let sseState = null;          // last SSE snapshot/update event
let lines = [];               // [{text, timeMs, endTimeMs}]
let linesId = null;           // which id they belong to
let offsetMs = 0;             // sink lag compensation + user nudge
let renderedLine = -2;        // currently highlighted index (-2 = unset)
const lyricCache = new Map(); // id -> lines[] (or null = honest 404)

window.addEventListener('error', () => {}); // keep the demo resilient

// toggle + offset UI
$('lyricsToggle').onclick = () => {
  const el = $('lyrics');
  el.hidden = !el.hidden;
  $('lyricsToggle').textContent = el.hidden ? 'show' : 'hide';
};
const setOffset = v => { offsetMs = v; $('off').textContent = v; };
$('offMinus').onclick = () => setOffset(Math.max(offsetMs - 100, -5000));
$('offPlus').onclick = () => setOffset(Math.min(offsetMs + 100, 5000));

// the contract, verbatim
function activeLineIndex(ls, elapsed, off) {
  let active = -1;
  for (let i = 0; i < ls.length; i++)
    if (ls[i].timeMs <= elapsed + off) active = i;
    else break;
  return active;
}

function interpolatedElapsed(st) {
  if (!st || st.elapsedMs == null) return 0;
  const drift = st.isPlaying ? Math.max(0, Date.now() - (st.ts || Date.now())) : 0;
  return Math.min(st.elapsedMs + drift, st.durationMs ?? Infinity);
}

async function loadLyrics(id) {
  if (id === linesId) return;              // fetch per id change ONLY
  linesId = id; lines = []; renderedLine = -2;
  if (!id) { $('lyrics').textContent = 'nothing playing'; return; }
  if (lyricCache.has(id)) { lines = lyricCache.get(id) || []; renderLyrics(); return; }
  $('lyrics').textContent = '…';
  try {
    const r = await fetch('/api/catalog/songs/' + encodeURIComponent(id) + '/lyrics');
    if (r.status === 404) { lyricCache.set(id, null);              // normal!
      $('lyrics').textContent = 'instrumental / no lyrics available'; return; }
    const j = await r.json();
    lines = (j.lines || []).filter(l => l.timeMs != null);
    lyricCache.set(id, lines);
  } catch { $('lyrics').textContent = 'lyrics unavailable'; return; }
  renderLyrics();
}

function renderLyrics() {
  if (!lines.length) return;
  $('lyrics').innerHTML = lines.map(l =>
    `<div>${l.text || '♪'}</div>`).join('');
}

// render loop: recompute the active line at animation pace; touch the DOM
// only when the line actually changes
function lyricsTick() {
  if (!$('lyrics').hidden && lines.length) {
    const i = activeLineIndex(lines, interpolatedElapsed(sseState), offsetMs);
    if (i !== renderedLine) {
      renderedLine = i;
      const kids = $('lyrics').children;
      for (let k = 0; k < kids.length; k++)
        kids[k].className = k === i ? 'active' : '';
      if (i >= 0 && kids[i]) kids[i].scrollIntoView({ block: 'center',
                                                      behavior: 'smooth' });
    }
  }
  requestAnimationFrame(lyricsTick);
}
requestAnimationFrame(lyricsTick);
</script>
</body>
</html>
