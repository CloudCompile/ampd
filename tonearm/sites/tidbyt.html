<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tidbyt remote — tonearm</title>
<link rel="stylesheet" href="/sites/common.css">
<style>
  .hero{display:flex;gap:18px;align-items:center}.hero img{width:128px;height:128px;object-fit:cover;border-radius:14px;background:#20212a}.meta{min-width:0}.meta h1{margin:.15rem 0}.meta p{margin:.2rem 0}.rows{display:grid;gap:6px}.row{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;background:rgba(255,255,255,.04);cursor:pointer}.row:hover{background:rgba(250,45,72,.14)}.row span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row small{margin-left:auto;color:var(--muted)}input,select{width:100%;box-sizing:border-box;padding:9px;border-radius:9px;border:1px solid #444;background:#14151b;color:inherit}.controls{display:flex;gap:8px;flex-wrap:wrap}.controls button{min-width:74px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:700px){.two{grid-template-columns:1fr}.hero img{width:92px;height:92px}}
</style>
</head>
<body><main>
  <section class="hero"><img id="art" alt=""><div class="meta"><div class="dim small">TIDBYT REMOTE</div><h1 id="title">nothing playing</h1><p id="artist" class="dim"></p><p id="album" class="dim small"></p><div class="controls"><button id="toggle">play</button><button id="prev">previous</button><button id="next">next</button><button id="back">smart back</button></div></div></section>
  <section><h2>Search library and catalog</h2><input id="search" placeholder="song, artist, album…"><div id="results" class="rows"></div></section>
  <section class="two"><div><h2>Playlists</h2><div id="playlists" class="rows"></div></div><div><h2>Tidbyt settings</h2><label>Display mode<select id="mode"><option>auto</option><option>artwork</option><option>lyrics</option></select></label><p class="dim small">Auto shows synced lyrics in the right tile when available; otherwise album art.</p><label>Speaker volume<input id="volume" type="range" min="0" max="100" value="80"></label><p class="dim small">This controls the Tidbyt speaker, not the Apple Music source.</p></div></section>
  <section><h2>Button assignments</h2><div class="two"><label>Hold<select id="hold"></select></label><label>Double hold<select id="double-hold"></select></label></div><button id="save" class="act">Save device settings</button></section>
</main><script type="module" src="/sites/tidbyt.js"></script></body></html>
