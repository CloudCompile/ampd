[tool.poetry]
name = "ampd-client"
version = "0.5.0"
description = "A client library for accessing ampd"
authors = []
readme = "README.md"
packages = [
    { include = "ampd_client" },
]
include = ["ampd_client/py.typed"]

[tool.poetry.dependencies]
python = "^3.11"
httpx2 = ">=2.13.1,<3"
attrs = ">=22.2.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "I", "UP"]
